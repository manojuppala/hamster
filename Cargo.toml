[package]
name = "hamster"
version = "0.1.0"
edition = "2021"
authors = ["Hamster Contributors"]
description = "A Git-like version control system written in Rust"
license = "MIT"

[[bin]]
name = "ham"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
chrono = "0.4"
walkdir = "2.4"
ignore = "0.4"
diff = "0.1"
similar = "2.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tar = "0.4"
home = "0.5"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hamster_benchmarks"
harness = false
